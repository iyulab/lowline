[package]
name = "lowline-ffi"
version.workspace = true
description = "C ABI over the Lowline engine, for the .NET host."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# The native side of the .NET package; it ships inside NuGet, never to crates.io.
publish = false

[lib]
name = "lowline_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
lowline = { path = "../lowline", features = ["gil", "formdown", "serde"] }
gil = { package = "iyulab-gil", version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
