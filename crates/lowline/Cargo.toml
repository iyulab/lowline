[package]
name = "lowline"
version = "0.0.0"
description = "Form engine that learns from confirmed records: tracks what a person did with each suggestion and turns it into the settlement a decider learns from."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["forms", "suggestion", "provenance"]
categories = ["algorithms"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialize and Deserialize for what a host keeps or sends on: policies, suggestions, drafts, settlements.
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
