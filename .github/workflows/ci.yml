name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

# A newer push makes the run for the older one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The UI, the shell and the sidecar are each tested where they build, on Linux. The end-to-end
# scenarios drive the real app window, which the app ships for Windows first: they run on a Windows
# runner — the one job here that needs that OS.
jobs:
  test:
    runs-on: ubuntu-latest
    # A cold Rust + WebKitGTK build is the long pole; a hung step should not burn the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt

      # First, since it needs nothing built: the shell's code is formatted as `cargo fmt` leaves it.
      - name: Shell format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-cargo-

      - name: System libraries for the shell (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install
        run: npm ci

      - name: UI — types and tests
        run: |
          npm run typecheck
          npm test

      # The shell embeds the built UI and bundles the published sidecar; the tests need neither to
      # be real, only present.
      - name: Shell tests
        run: |
          npx vite build
          mkdir -p src-host/publish
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Sidecar tests
        run: npm run test:host

  e2e:
    runs-on: windows-latest
    # Builds the sidecar and a debug shell, then drives the app through every scenario.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-e2e-${{ steps.toolchain.outputs.cachekey }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-${{ steps.toolchain.outputs.cachekey }}-cargo-

      - name: Install
        run: npm ci

      - name: Build the sidecar and the app
        run: |
          npm run build:host
          npm run build:e2e

      # A failing scenario names the step it was waiting for; nothing is uploaded.
      - name: End-to-end scenarios
        run: npm run test:e2e

      # The same scenarios with the vault opened through this machine's administrative share, as a
      # vault on a network share is: no trash, paths starting \\. Runs where the share is reachable;
      # where it is not, the run says so rather than passing quietly.
      - name: Administrative share
        id: share
        run: |
          # The vault is made under the temp folder, so it is that drive's share the scenarios go through.
          $share = "\\localhost\" + (Split-Path $env:TEMP -Qualifier).TrimEnd(':') + "$"
          if (Test-Path "$share\") { "reachable=true" >> $env:GITHUB_OUTPUT }
          else { Write-Output "::warning::$share is not reachable on this runner; the scenarios did not run over SMB" }

      - name: End-to-end scenarios over SMB
        if: steps.share.outputs.reachable == 'true'
        env:
          E2E_VAULT_UNC: '1'
        run: npm run test:e2e

      # What the app runs the sidecar from, when a scenario failed: a missing file shows here.
      - name: Sidecar files
        if: failure()
        run: |
          Get-ChildItem src-host/publish, src-tauri/target/debug/host | Format-Table Directory, Name, Length, LastWriteTime
