name: Release

# Publishes the .NET packages (Lowline, Lowline.Sqlite, Lowline.Extensions.AI) to NuGet and the form element
# (@iyulab/lowline-form) to npm. The `lowline` crate goes to crates.io from the same tag by hand:
# `cargo publish -p lowline` (README, «Releasing»).
#
# NuGet: this repository holds no NuGet key. The packed .nupkg files go up as the artifact `nuget-packages` and the
# organization's publishing repository, iyulab/nuget-publish, pushes them with Trusted Publishing (`request.yml`).
#
# To release: `npx @iyulab/tauri-kit-dev versions --config versions.config.js --bump <version>`, move the
# changelog's [Unreleased] under that version, commit, tag `v<version>`, push the tag.
# - Pushing a `v*` tag publishes that tag.
# - Manual dispatch builds, packs and tries the packages on three systems; with `publish` it also publishes, but only
#   when a `v<version>` tag exists and the source is the same as it, so what reaches a registry is always the tagged
#   source.
# Re-running is safe: versions already on a registry are skipped.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet and npm (needs the v<version> tag on this source)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: One version in every file
        run: npx --yes @iyulab/tauri-kit-dev@0.11.1 versions --config versions.config.js

      - name: Source matches the release tag
        id: version
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          VERSION=$(node -p "require('./bindings/web/package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "::error::Pushed tag $GITHUB_REF_NAME does not match the version $VERSION."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH_INPUT" = "true" ]; then
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG does not exist — tag the release commit first."
              exit 1
            fi
            if ! git diff --quiet "$TAG" HEAD -- crates bindings Cargo.toml Cargo.lock; then
              echo "::error::The source differs from $TAG — publish from the tag."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Said on every run, so a trial run shows whether a publish would find its keys; only a publish needs them.
      # RELEASE_BOT_PRIVATE_KEY lets `request.yml` ask iyulab/nuget-publish to push the NuGet packages.
      - name: Registry keys reach this repository
        env:
          RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          missing=0
          for name in RELEASE_BOT_PRIVATE_KEY NPM_TOKEN; do
            if [ -n "${!name}" ]; then echo "$name: available"; else echo "::warning::$name is not available"; missing=1; fi
          done
          [ "$PUBLISH" != "true" ] || [ "$missing" -eq 0 ]

      - uses: dtolnay/rust-toolchain@stable

      # What crates.io would take: the crate's own folder, its readme and license, building on its own.
      - name: The crate packs
        run: cargo publish -p lowline --dry-run

  # One native library per runtime; the matrix is the only list of them, so adding a runtime here ships it.
  native:
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, target: x86_64-pc-windows-msvc, out: target/x86_64-pc-windows-msvc/release/lowline_native.dll }
          - { rid: win-arm64, os: windows-latest, target: aarch64-pc-windows-msvc, out: target/aarch64-pc-windows-msvc/release/lowline_native.dll }
          # The library links against the build image's glibc, so the image decides the oldest Linux it loads on.
          - { rid: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, out: target/x86_64-unknown-linux-gnu/release/liblowline_native.so }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, out: target/aarch64-unknown-linux-gnu/release/liblowline_native.so }
          # Alpine (musl) is built where it runs: in an Alpine image on the runner of the same architecture, so the
          # library is linked against musl's own loader, dynamically (a musl cdylib cannot be built static).
          - { rid: linux-musl-x64, os: ubuntu-24.04, musl: true, out: target/release/liblowline_native.so }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm, musl: true, out: target/release/liblowline_native.so }
          - { rid: osx-x64, os: macos-latest, target: x86_64-apple-darwin, out: target/x86_64-apple-darwin/release/liblowline_native.dylib }
          - { rid: osx-arm64, os: macos-latest, target: aarch64-apple-darwin, out: target/aarch64-apple-darwin/release/liblowline_native.dylib }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.musl }}
        with:
          targets: ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.musl }}
        run: cargo build --release --locked -p lowline-ffi --target ${{ matrix.target }}

      # The Alpine image's Rust is the host's own, musl: `-crt-static` off makes the library dynamic, as a cdylib must be
      # there, and it needs Alpine's `libgcc` at run time — which the .NET images for Alpine carry.
      - name: Build (Alpine)
        if: ${{ matrix.musl }}
        run: >
          docker run --rm -v "$PWD":/src -w /src -e RUSTFLAGS="-C target-feature=-crt-static" rust:alpine
          sh -c "apk add --no-cache musl-dev && cargo build --release --locked -p lowline-ffi"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: ${{ matrix.out }}
          if-no-files-found: error
          retention-days: 1

  pack:
    needs: [check, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native

      # Each runtime holds exactly one library; a missing one would otherwise reach the package unnoticed.
      - name: Place the libraries by runtime
        run: |
          for dir in native/native-*; do
            rid="${dir#native/native-}"
            dest="bindings/csharp/Lowline/runtimes/$rid/native"
            mkdir -p "$dest"
            mv "$dir"/* "$dest/"
            [ "$(find "$dest" -type f | wc -l)" -eq 1 ] || { echo "::error::$dest holds other than one library"; exit 1; }
          done
          [ "$(ls bindings/csharp/Lowline/runtimes | wc -l)" -eq 8 ] || { echo "::error::expected eight runtimes"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The crates linked into the native libraries, with their license texts; a crate without one fails the release.
      - name: Write the native libraries' notices
        run: npx --yes @iyulab/tauri-kit-dev@0.11.1 notices --config notices/config.mjs --strict

      # NuGet and npm packages go in separate folders: the NuGet artifact may hold .nupkg/.snupkg files only.
      - name: Pack
        run: |
          for project in Lowline Lowline.Sqlite Lowline.Extensions.AI; do
            dotnet pack "bindings/csharp/$project/$project.csproj" -c Release -o packages
          done
          unzip -l "packages/Lowline.${{ needs.check.outputs.version }}.nupkg" | grep -E "runtimes/|THIRD-PARTY-NOTICES"

      - name: Pack the form element
        working-directory: bindings/web
        run: |
          npm ci
          npm run build
          npm run bundle
          npm test
          mkdir -p ../../npm-package
          npm pack --pack-destination ../../npm-package
          tar -tzf ../../npm-package/iyulab-lowline-form-${{ needs.check.outputs.version }}.tgz | grep -x package/LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: packages/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: npm-package/
          if-no-files-found: error
          retention-days: 1

  # Restores the packages just packed on each system and calls into the native library.
  smoke:
    needs: [check, pack]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: packages

      - name: Load the native library from the package
        shell: bash
        run: >
          dotnet run --project bindings/package-smoke
          -p:LowlineVersion=${{ needs.check.outputs.version }}
          -p:RestoreAdditionalProjectSources="$GITHUB_WORKSPACE/packages"

      # Alpine takes the musl library, not the glibc one that `linux-x64` carries: restore the packages in a .NET image
      # for Alpine and call into it there.
      - name: Load the native library from the package on Alpine
        if: runner.os == 'Linux'
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE":/w -w /w -e DOTNET_NOLOGO=true mcr.microsoft.com/dotnet/sdk:10.0-alpine
          dotnet run --project bindings/package-smoke
          -p:LowlineVersion=${{ needs.check.outputs.version }}
          -p:RestoreAdditionalProjectSources=/w/packages

  # A run triggered by a pull request is refused by iyulab/nuget-publish; this workflow has no such trigger.
  nuget:
    needs: [check, smoke]
    if: needs.check.outputs.publish == 'true'
    uses: iyulab/nuget-publish/.github/workflows/request.yml@de1e58c8bcefaf88f497fcb58899a1c6e84f4e29 # main
    permissions: {}
    secrets: inherit

  npm:
    needs: [check, smoke]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-package

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::NPM_TOKEN is not available to this repository"; exit 1; }
          if npm view "@iyulab/lowline-form@$VERSION" version >/dev/null 2>&1; then
            echo "@iyulab/lowline-form@$VERSION is already on npm — skipped."
          else
            # `./` — a bare `dir/file.tgz` reads as a GitHub repository to npm.
            npm publish "./npm-package/iyulab-lowline-form-$VERSION.tgz" --provenance --access public
          fi
