<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><style>.dark { display: none } @media (prefers-color-scheme: dark) { .light { display: none } .dark { display: inline } }</style><g class="light"><style>
@keyframes ll-blink { 0% { opacity: 1 } 50% { opacity: 0 } }
@keyframes ll-confirm { 0% { fill: var(--ll-k-pending) } 25% { fill: var(--ll-k-ink) } 60% { fill: var(--ll-k-ink) } 100% { fill: var(--ll-k-pending) } }
 .ll-caret { animation: ll-blink 1060ms steps(1, end) infinite } @media (prefers-reduced-motion: reduce) { .ll-caret { animation: none } }</style><g transform="translate(0 0) scale(4)" shape-rendering="crispEdges"><rect x="2" y="11" width="7" height="2" fill="#1a1a1a"/><rect x="10" y="11" width="2" height="2" fill="#b4b1aa"/><rect x="13" y="11" width="2" height="2" fill="#b4b1aa"/><rect x="1" y="3" width="1" height="10" fill="#2f4a6d" class="ll-caret"/></g></g><g class="dark"><style>
@keyframes ll-blink { 0% { opacity: 1 } 50% { opacity: 0 } }
@keyframes ll-confirm { 0% { fill: var(--ll-k-pending) } 25% { fill: var(--ll-k-ink) } 60% { fill: var(--ll-k-ink) } 100% { fill: var(--ll-k-pending) } }
 .ll-caret { animation: ll-blink 1060ms steps(1, end) infinite } @media (prefers-reduced-motion: reduce) { .ll-caret { animation: none } }</style><g transform="translate(0 0) scale(4)" shape-rendering="crispEdges"><rect x="2" y="11" width="7" height="2" fill="#f7f5f0"/><rect x="10" y="11" width="2" height="2" fill="#6b6964"/><rect x="13" y="11" width="2" height="2" fill="#6b6964"/><rect x="1" y="3" width="1" height="10" fill="#f7f5f0" class="ll-caret"/></g></g></svg>