[package]
name = "lowline"
version = "0.0.0"
description = "A local form editor that learns from your confirmations"
authors = ["iyulab"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
# A distinct lib name avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "lowline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Canonical paths without the `\\?\` prefix on Windows (already a Tauri dependency).
dunce = "1"
# The sidecar: a per-launch token, and HTTP to it on loopback.
getrandom = "0.4"
# Loopback HTTP to the sidecar, and HTTPS for error reports through the OS's TLS and certificate
# store — the roots and proxy an office PC is set up with. `native-tls-no-default` alone does not
# compile the native-tls transport in ureq 3.4, so the full feature is needed.
ureq = { version = "3", default-features = false, features = ["native-tls", "win-system-proxy"] }
# Added together: adding a crate from the same git source later re-resolves Cargo.lock.
tauri-kit-fs = { git = "https://github.com/iyulab/tauri-kit", tag = "v0.5.0" }
tauri-kit-sidecar = { git = "https://github.com/iyulab/tauri-kit", tag = "v0.5.0" }
tauri-kit-watch = { git = "https://github.com/iyulab/tauri-kit", tag = "v0.5.0" }
# Deleting moves a file to the system's trash (Recycle Bin, Trash, freedesktop trash), where the
# person restores it from — the vault keeps no trash of its own.
trash = "5.2.9"

# Whether a location has a Recycle Bin at all: on a network share or a removable drive the system
# deletes for good, without asking, when told to recycle.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3"
